<div class="flex-1 overflow-auto p-4 lg:p-6 space-y-5">
  <div class="flex flex-wrap items-center gap-3">
    <span class="eyebrow">Reporting period</span>
    <div class="segment-track">
      @for (option of ranges; track option) {
        <button type="button" class="segment" [attr.data-active]="range() === option" (click)="range.set(option)">
          {{ option }}
        </button>
      }
    </div>
    <span class="ml-auto text-[12px]" style="color: var(--text-3)">
      {{ totalRows }} rows available across {{ reports.length }} reports
    </span>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
    @for (report of reports; track report.id; let i = $index) {
      <app-surface-card class="p-5 flex flex-col" [animDelay]="'delay-' + ((i % 4) + 1) * 50">
        <div class="flex items-start justify-between gap-3">
          <span
            class="w-11 h-11 rounded-2xl flex items-center justify-center flex-shrink-0"
            style="background: var(--surface-2)"
            [style.color]="'var(--text-1)'"
          ><span class="icon icon-lg">{{ report.icon }}</span></span>
          <span
            class="text-[11px] font-semibold px-2.5 py-1 rounded-full"
            style="background: var(--surface-3); color: var(--text-2)"
          >{{ report.range }}</span>
        </div>

        <p class="text-[14.5px] font-bold font-display mt-4" style="color: var(--text-1)">{{ report.name }}</p>
        <p class="text-[12.5px] mt-1 leading-relaxed flex-1" style="color: var(--text-3)">{{ report.desc }}</p>

        <p class="text-[12px] font-mono mt-3 tabular" style="color: var(--primary-ink)">{{ reportSummary(report) }}</p>

        <div class="flex items-center gap-2 mt-4">
          <button
            type="button"
            (click)="generate(report)"
            class="flex-1 text-[12.5px] font-semibold px-3 py-2 rounded-full transition-all hover:opacity-90"
            style="background: var(--primary); color: #fff"
          >
            Download CSV
          </button>
          <button
            type="button"
            (click)="printReport(report)"
            class="text-[12.5px] font-semibold px-3.5 py-2 rounded-full border transition-all hover:opacity-80"
            style="border-color: var(--border); color: var(--text-2)"
          >
            PDF
          </button>
        </div>
      </app-surface-card>
    }
  </div>
</div>
