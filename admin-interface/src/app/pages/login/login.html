<div
  class="min-h-screen flex items-center justify-center relative overflow-hidden"
  style="background: linear-gradient(135deg,#060d1a 0%,#0f2044 40%,#1e3a8a 70%,#1e40af 100%)"
>
  <!-- Animated background blobs -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div
      class="absolute w-72 h-72 rounded-full opacity-10 animate-float"
      style="background: radial-gradient(circle,#2563eb,transparent); top: 10%; left: 15%"
    ></div>
    <div
      class="absolute w-96 h-96 rounded-full opacity-8 animate-float delay-200"
      style="background: radial-gradient(circle,#10b981,transparent); bottom: 15%; right: 10%; animation-delay: 2s"
    ></div>
    <div
      class="absolute w-64 h-64 rounded-full opacity-10 animate-float"
      style="background: radial-gradient(circle,#d97706,transparent); top: 50%; right: 30%; animation-delay: 4s"
    ></div>
    <!-- Grid lines -->
    <svg class="absolute inset-0 w-full h-full opacity-5" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)" />
    </svg>
  </div>

  <!-- Card -->
  <div class="relative w-full max-w-md mx-4 animate-fade-up">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-3 mb-3">
        <div
          class="w-12 h-12 rounded-2xl flex items-center justify-center text-white text-xl font-bold"
          style="background: linear-gradient(135deg,#2563eb,#4f46e5); box-shadow: 0 0 32px rgba(37,99,235,.5)"
        >
          SM
        </div>
        <div class="text-left">
          <p class="text-white text-xl font-bold font-display">SmartMoney</p>
          <p class="text-blue-300 text-[13px]">Intelligence · Admin Portal</p>
        </div>
      </div>
    </div>

    <div class="rounded-3xl border border-white/10 p-8 backdrop-blur-xl" style="background: rgba(255,255,255,.07)">
      @if (step() === 'login') {
        <div class="space-y-5 animate-fade-up">
          <div>
            <h1 class="text-white text-lg font-bold font-display">Welcome back</h1>
            <p class="text-[13px] text-blue-200/80 mt-0.5">Use your platform administrator account.</p>
          </div>

          <!--
            Google sign-in is hidden until identity-service supports it. To restore,
            uncomment this block and add a signInWithGoogle() handler to login.ts.

          <button
            type="button"
            (click)="signInWithGoogle()"
            class="w-full flex items-center justify-center gap-3 py-3 rounded-xl border border-white/20 text-white text-sm font-semibold hover:bg-white/10 transition-all"
          >
            <svg width="18" height="18" viewBox="0 0 18 18">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" />
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" />
              <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" />
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z" />
            </svg>
            Sign in with Google
          </button>

          <div class="flex items-center gap-3">
            <div class="flex-1 h-px" style="background: rgba(255,255,255,.15)"></div>
            <span class="text-[13px] text-blue-300">or use admin credentials</span>
            <div class="flex-1 h-px" style="background: rgba(255,255,255,.15)"></div>
          </div>
          -->

          <form (submit)="submitCredentials($event)" class="space-y-4" novalidate>
            <div>
              <label for="admin-email" class="text-[12px] font-medium text-blue-200 mb-1.5 block">Email address</label>
              <input
                id="admin-email"
                name="email"
                type="email"
                autocomplete="username"
                autofocus
                required
                [disabled]="loading()"
                [value]="email()"
                (input)="email.set($any($event.target).value)"
                placeholder="you&#64;company.com"
                class="w-full px-4 py-3 rounded-xl text-sm text-white border border-white/20 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/30 bg-white/10 placeholder-blue-300/50 disabled:opacity-60 transition-all"
              />
            </div>
            <div>
              <label for="admin-password" class="text-[12px] font-medium text-blue-200 mb-1.5 block">Password</label>
              <div class="relative">
                <input
                  id="admin-password"
                  name="password"
                  [type]="showPassword() ? 'text' : 'password'"
                  autocomplete="current-password"
                  required
                  [disabled]="loading()"
                  [value]="password()"
                  (input)="password.set($any($event.target).value)"
                  placeholder="Enter your password"
                  class="w-full px-4 py-3 rounded-xl text-sm text-white border border-white/20 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/30 bg-white/10 placeholder-blue-300/50 pr-11 disabled:opacity-60 transition-all"
                />
                <button
                  type="button"
                  (click)="showPassword.set(!showPassword())"
                  [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-blue-300 hover:text-white text-sm transition-all"
                >
                  <span class="icon icon-sm">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
                </button>
              </div>
            </div>

            <!--
              Hidden until they do something: there is no "remember me" session
              option and no password-reset flow in identity-service yet.

            <div class="flex items-center justify-between">
              <label class="flex items-center gap-2 text-[13px] text-blue-300">
                <input type="checkbox" class="rounded" /> Remember me
              </label>
              <button type="button" class="text-[13px] text-blue-300 hover:text-white transition-all">
                Forgot password?
              </button>
            </div>
            -->

            @if (error()) {
              <div
                role="alert"
                class="flex items-start gap-2 px-3 py-2.5 rounded-lg text-[13px] border"
                style="background: rgba(239,68,68,.12); border-color: rgba(248,113,113,.5); color: #fecaca"
              >
                <span class="icon icon-sm mt-px">error</span>
                <span>{{ error() }}</span>
              </div>
            }

            <button
              type="submit"
              [disabled]="loading()"
              class="w-full py-3 rounded-xl text-white text-sm font-bold transition-all hover:brightness-110 disabled:opacity-70 flex items-center justify-center gap-2"
              style="background: linear-gradient(135deg,#2563eb,#4f46e5); box-shadow: 0 4px 20px rgba(37,99,235,.4)"
            >
              @if (loading()) {
                <span class="inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                Signing in…
              } @else {
                Sign in
                <span class="icon icon-sm">arrow_forward</span>
              }
            </button>
          </form>

          <p class="text-[12px] text-center text-blue-300/60 flex items-center justify-center gap-1">
            <span class="icon icon-sm">lock</span> Access restricted to platform administrator accounts only.
          </p>
        </div>
      }
    </div>

    <p class="text-center text-[12px] text-blue-300/40 mt-4">
      SmartMoney Intelligence © 2026 · All rights reserved
    </p>
  </div>
</div>
