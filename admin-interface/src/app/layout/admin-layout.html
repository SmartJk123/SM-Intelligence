<!-- Full bleed shell: the application fills the viewport, so no page background
     is visible around it. The content area carries the soft page colour. -->
<div class="h-full flex overflow-hidden" style="background: var(--surface)">
  <app-sidebar
    [active]="activePage()"
    [open]="ui.sidebarOpen()"
    (closed)="ui.closeSidebar()"
    (logout)="ui.openLogout()"
  />

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <app-topbar
      [page]="activePage()"
      [theme]="theme.theme()"
      (menuToggle)="ui.toggleSidebar()"
      (themeToggle)="theme.toggle()"
      (navigate)="navigate($event)"
      (logout)="ui.openLogout()"
      (profileClick)="goToProfile()"
    />
    <main class="flex-1 flex flex-col overflow-hidden min-h-0" style="background: var(--bg)">
      <router-outlet />
    </main>
  </div>

  @if (ui.logoutOpen()) {
    <app-logout-modal (confirmed)="confirmLogout()" (cancelled)="ui.closeLogout()" />
  }

  @if (ui.inviteType(); as inviteType) {
    <app-invite-modal [type]="inviteType" [preset]="ui.invitePreset()" (closed)="ui.closeInvite()" />
  }

  @if (idle.secondsLeft() !== null) {
    <div
      role="alertdialog"
      aria-live="assertive"
      aria-labelledby="idle-title"
      class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[1000] flex items-center gap-4 max-w-[calc(100vw-32px)] px-4 py-3 rounded-xl border text-[13px] shadow-2xl"
      style="background: var(--surface); border-color: rgba(251,191,36,.55); color: var(--text-1)"
    >
      <p id="idle-title" class="m-0">
        <strong>Still there?</strong> For security you will be signed out in {{ idle.secondsLeft() }} seconds because of inactivity.
      </p>
      <button type="button" class="px-3 py-1.5 rounded-lg font-semibold bg-blue-600 text-white hover:bg-blue-500" (click)="idle.stayActive()">
        Stay signed in
      </button>
    </div>
  }

  <app-notification-dialog />
  <app-toast-outlet />
</div>
