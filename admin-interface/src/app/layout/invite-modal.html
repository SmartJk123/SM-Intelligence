<div class="fixed inset-0 z-50 flex items-center justify-center animate-fade-in" style="background: rgba(0,0,0,.5)">
  <div
    class="w-full max-w-md rounded-2xl border animate-fade-up p-6"
    style="background: var(--surface); border-color: var(--border); box-shadow: var(--shadow-lg)"
  >
    @if (!sent()) {
      <div class="flex items-center justify-between mb-5">
        <div>
          <h3 class="text-base font-bold font-display" style="color: var(--text-1)">{{ title() }}</h3>
          <p class="text-[13px] mt-0.5" style="color: var(--text-3)">
            An invite link with login credentials will be sent via email.
          </p>
        </div>
        <button type="button" (click)="closed.emit()" class="text-xl leading-none" style="color: var(--text-3)">✕</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-[12px] font-medium mb-1 block" style="color: var(--text-2)">
            {{ isOrg() ? 'Organisation Name' : 'Full Name' }} *
          </label>
          <input
            [value]="name()"
            (input)="name.set($any($event.target).value)"
            [placeholder]="isOrg() ? 'e.g. Kilimani Properties Ltd' : 'e.g. James Otieno'"
            class="w-full px-3 py-2 text-sm rounded-lg border focus:outline-none"
            style="background: var(--surface-2); border-color: var(--border); color: var(--text-1)"
          />
        </div>
        <div>
          <label class="text-[12px] font-medium mb-1 block" style="color: var(--text-2)">Email Address *</label>
          <input
            type="email"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            placeholder="contact@organisation.co.ke"
            class="w-full px-3 py-2 text-sm rounded-lg border focus:outline-none"
            style="background: var(--surface-2); border-color: var(--border); color: var(--text-1)"
          />
        </div>

        @if (isOrg()) {
          <div>
            <label class="text-[12px] font-medium mb-1 block" style="color: var(--text-2)">Business Type</label>
            <select
              [value]="orgType()"
              (change)="orgType.set($any($event.target).value)"
              class="w-full px-3 py-2 text-sm rounded-lg border focus:outline-none"
              style="background: var(--surface-2); border-color: var(--border); color: var(--text-1)"
            >
              @for (businessType of businessTypes; track businessType) {
                <option [value]="businessType">{{ businessType }}</option>
              }
            </select>
          </div>
        } @else {
          <div>
            <label class="text-[12px] font-medium mb-1 block" style="color: var(--text-2)">Organisation</label>
            <select
              class="w-full px-3 py-2 text-sm rounded-lg border focus:outline-none"
              style="background: var(--surface-2); border-color: var(--border); color: var(--text-1)"
            >
              @for (org of orgs; track org.id) {
                <option>{{ org.name }}</option>
              }
            </select>
          </div>
          <div>
            <label class="text-[12px] font-medium mb-1 block" style="color: var(--text-2)">Role</label>
            <select
              [value]="role()"
              (change)="role.set($any($event.target).value)"
              class="w-full px-3 py-2 text-sm rounded-lg border focus:outline-none"
              style="background: var(--surface-2); border-color: var(--border); color: var(--text-1)"
            >
              @for (roleOption of roles; track roleOption) {
                <option [value]="roleOption">{{ roleOption }}</option>
              }
            </select>
          </div>
        }
      </div>

      <div class="flex gap-3 mt-5">
        <button
          type="button"
          (click)="closed.emit()"
          class="flex-1 py-2 rounded-lg text-sm font-semibold border transition-all"
          style="border-color: var(--border); color: var(--text-2)"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="send()"
          [disabled]="!canSend()"
          class="flex-1 py-2 rounded-lg text-sm font-semibold text-white transition-all disabled:opacity-40"
          style="background: var(--primary)"
        >
          Send Invite Link
        </button>
      </div>
    } @else {
      <div class="text-center py-4 animate-fade-up">
        <div
          class="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"
          style="background: var(--green-soft); color: var(--green)"
        >✓</div>
        <h3 class="text-base font-bold mb-1 font-display" style="color: var(--text-1)">Invite Sent!</h3>
        <p class="text-[13px] mb-4" style="color: var(--text-2)">
          An invitation email has been sent to <strong>{{ email() }}</strong> with a temporary username and password.
        </p>
        <div
          class="px-3 py-2 rounded-lg border text-left mb-4"
          style="background: var(--surface-2); border-color: var(--border)"
        >
          <p class="text-[11px] font-semibold uppercase tracking-widest mb-1" style="color: var(--text-3)">Invite Link</p>
          <p class="text-[12px] font-mono break-all" style="color: var(--primary)">{{ inviteLink }}</p>
        </div>
        <button
          type="button"
          (click)="closed.emit()"
          class="px-6 py-2 rounded-lg text-sm font-semibold text-white"
          style="background: var(--primary)"
        >
          Done
        </button>
      </div>
    }
  </div>
</div>
