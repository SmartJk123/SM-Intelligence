# Activate with: --spring.profiles.active=postgres
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartmoney}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:smartmoney}
    password: ${DB_PASSWORD:smartmoney}
  jpa:
    hibernate:
      ddl-auto: update
