server:
  port: ${PORT:8091}

spring:
  application:
    name: assistant-service

raha:
  provider: ${LLM_PROVIDER:gemini}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    endpoint: ${DEEPSEEK_ENDPOINT:https://api.deepseek.com/chat/completions}

services:
  identity-url: ${IDENTITY_SERVICE_URL:http://${IDENTITY_SERVICE_HOSTPORT:localhost:8081}}
  accounts-url: ${ACCOUNTS_SERVICE_URL:http://${ACCOUNTS_SERVICE_HOSTPORT:localhost:8082}}
  transactions-url: ${TRANSACTIONS_SERVICE_URL:http://${TRANSACTIONS_SERVICE_HOSTPORT:localhost:8083}}
  budgets-url: ${BUDGETS_SERVICE_URL:http://${BUDGETS_SERVICE_HOSTPORT:localhost:8085}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
