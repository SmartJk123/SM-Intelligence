server:
  port: ${PORT:8087}

spring:
  application:
    name: forecasts-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/smi_forecasts}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
