server:
  port: ${PORT:8090}

# Keep the console readable. A DEBUG environment variable on the machine would
# otherwise switch Spring into full debug logging and bury the useful lines.
logging:
  level:
    root: INFO
    io.smartmoney: INFO
    org.springframework.web: WARN
    org.hibernate: WARN

spring:
  application:
    name: bank-integration-service
  datasource:
    url: jdbc:h2:file:./data/smartmoney;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

smartmoney:
  # The address the bank can reach. For sandbox testing set this to your tunnel URL.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  security:
    # true opens the admin API to anyone. For tests and isolated debugging only.
    permit-all: ${PERMIT_ALL:false}
    # The same JWT_SECRET identity-service signs tokens with. Admin API calls
    # carry the admin's identity token and are verified with it.
    jwt-secret: ${JWT_SECRET:}

  # Where a linked customer's bank movements are delivered, so they show on the
  # web dashboard. Private addresses: these services have no authentication.
  platform-services:
    accounts-url: ${ACCOUNTS_API_URL:http://localhost:8082}
    transactions-url: ${TRANSACTIONS_API_URL:http://localhost:8083}

  # Pulls NCBA notifications stored by the cPanel receiver (deploy/cpanel).
  # Off unless both are set; the token is export_token in cPanel's ncba-config.php.
  ncba-cpanel:
    export-url: ${NCBA_CPANEL_EXPORT_URL:}
    export-token: ${NCBA_CPANEL_EXPORT_TOKEN:}
    interval: ${NCBA_CPANEL_IMPORT_INTERVAL:PT1M}
  # Pulls KCB instant payment notifications stored by the cPanel receiver (kcb-webhook.php).
  # Off unless both are set; the token is export_token in cPanel's kcb-config.php.
  kcb-cpanel:
    export-url: ${KCB_CPANEL_EXPORT_URL:}
    export-token: ${KCB_CPANEL_EXPORT_TOKEN:}
    interval: ${KCB_CPANEL_IMPORT_INTERVAL:PT1M}

  stanbic:
    environment: ${STANBIC_ENV:SANDBOX}
    portal-url: https://sandbox.stanbicbank.co.ke/
    # Endpoints from the Stanbic "Register Your Payment Result URL for Real-time
    # Credit Alerts" 1.0.2 specification. Left empty, they follow STANBIC_ENV:
    #   SANDBOX     https://api.connect.stanbicbank.co.ke/api/sandbox
    #   PRODUCTION  https://api.connect.stanbicbank.co.ke/api/prod
    # with the token at <base>/auth/oauth2/token. Set them only to override.
    api-base-url: ${STANBIC_API_BASE_URL:}
    token-url: ${STANBIC_TOKEN_URL:}
    oauth-scope: ${STANBIC_OAUTH_SCOPE:payments}
    registration-path: ${STANBIC_REGISTRATION_PATH:/registerurl/}
    client-key: ${STANBIC_CLIENT_KEY:}
    client-secret: ${STANBIC_CLIENT_SECRET:}
    # ApiKey is a field of the registerurl request body, from the same portal page.
    api-key: ${STANBIC_API_KEY:}
    channel: ${STANBIC_CHANNEL:APGW}
    profile-approver: ${STANBIC_PROFILE_APPROVER:SmartMoney Intelligence}
    account-number: ${STANBIC_ACCOUNT_NUMBER:0100013306316}
    # Confirm the real account enquiry path from the API product page.
    account-enquiry-path: "${STANBIC_ACCOUNT_ENQUIRY_PATH:/accounts/{accountNumber}}"
    api-timeout-seconds: 30
    retry-attempts: 3
    retry-delay-seconds: 5
    webhook-path: /api/v1/webhooks/stanbic
    signature-verification: ${STANBIC_SIGNATURE_VERIFICATION:true}
    # Set both once Stanbic confirms how the callback is authenticated. There is
    # deliberately no default secret: a published one would let anyone forge a
    # notification, so with verification on and no secret every one is refused.
    signature-header: ${STANBIC_SIGNATURE_HEADER:X-Stanbic-Signature}
    signature-secret: ${STANBIC_SIGNATURE_SECRET:}

  kcb:
    environment: ${KCB_ENV:SANDBOX}
    portal-url: https://buni.kcbgroup.com/
    # BUNI keeps the OAuth endpoints on the accounts host, separate from the API gateway.
    token-url: ${KCB_TOKEN_URL:https://accounts.buni.kcbgroup.com/oauth2/token}
    revoke-url: https://accounts.buni.kcbgroup.com/oauth2/revoke
    api-base-url: ${KCB_API_BASE_URL:}
    # Generate a sandbox Key and Secret for the application in BUNI.
    client-key: ${KCB_CLIENT_KEY:${KCB_CONSUMER_KEY:}}
    client-secret: ${KCB_CLIENT_SECRET:${KCB_CONSUMER_SECRET:}}
    # BUNI accepts client credentials in the Authorization header or the form body.
    auth-style: ${KCB_AUTH_STYLE:basic}
    webhook-path: /api/v1/webhooks/kcb
    signature-verification: ${KCB_SIGNATURE_VERIFICATION:true}
    signature-header: ${KCB_SIGNATURE_HEADER:Signature}
    # KCB public key, as a PEM block, a path to a .pem file, or a base64 X.509 key.
    public-key: ${KCB_PUBLIC_KEY:}
    api-timeout-seconds: 30

  # NCBA pushes account level notifications to us. There is no token endpoint and
  # no registration API: the address, the secret key, the username, the password
  # and the account number are sent to the bank in writing and they configure it
  # on their side. See docs/ncba-integration-setup.md.
  ncba:
    environment: ${NCBA_ENV:SANDBOX}
    portal-url: ${NCBA_PORTAL_URL:}
    webhook-path: /api/v1/webhooks/ncba
    # Generate the secret key, at least 16 alphanumeric characters, and never
    # change it after it is submitted or every HashVal check will fail.
    secret-key: ${NCBA_SECRET_KEY:}
    username: ${NCBA_USERNAME:}
    password: ${NCBA_PASSWORD:}
    account-number: ${NCBA_ACCOUNT_NUMBER:}
    signature-verification: ${NCBA_SIGNATURE_VERIFICATION:true}
    api-timeout-seconds: 30
