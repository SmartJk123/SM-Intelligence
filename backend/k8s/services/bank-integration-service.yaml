apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-integration-service
  namespace: smi
  labels:
    app: bank-integration-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-integration-service
  template:
    metadata:
      labels:
        app: bank-integration-service
    spec:
      containers:
        - name: bank-integration-service
          image: smi-bank-integration-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          envFrom:
            - configMapRef:
                name: smi-config
            - secretRef:
                name: smi-secrets
          env:
            - name: PORT
              value: "8090"
            - name: DB_SCHEMA
              value: "public"
            - name: SPRING_PROFILES_ACTIVE
              value: "postgres"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 40
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bank-integration-service
  namespace: smi
  labels:
    app: bank-integration-service
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: 8090
      protocol: TCP
      name: http
  selector:
    app: bank-integration-service
