apiVersion: v1
kind: Secret
metadata:
  name: smi-secrets
  namespace: smi
type: Opaque
stringData:
  # Supabase / PostgreSQL Credentials
  DB_PASSWORD: "change-me-to-your-actual-db-password"
  
  # JWT Signing Secret (must match across identity & bank-integration)
  JWT_SECRET: "smi-production-super-secret-jwt-key-minimum-256-bits-long!!"
  
  # Internal Service Token for zero-trust balance mutations
  INTERNAL_SERVICE_TOKEN: "smi-internal-secure-token-x98f21k"
