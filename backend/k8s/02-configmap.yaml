apiVersion: v1
kind: ConfigMap
metadata:
  name: smi-config
  namespace: smi
data:
  # Shared Database Coordinates (Supabase session pooler on port 5432)
  DB_HOST: "aws-0-eu-west-2.pooler.supabase.com"
  DB_PORT: "5432"
  DB_NAME: "postgres"
  DB_USER: "postgres.smi"

  # Browser origins allowed by the edge API Gateway
  APP_CORS_ALLOWED_ORIGINS: "http://localhost:4200,http://localhost:4300,http://localhost:8080"

  # Internal Kubernetes Private CoreDNS Resolution (ClusterIPs)
  API_GATEWAY_SERVICE_URL: "http://api-gateway:8080"
  IDENTITY_SERVICE_URL: "http://identity-service:8081"
  ACCOUNTS_SERVICE_URL: "http://accounts-service:8082"
  TRANSACTIONS_SERVICE_URL: "http://transactions-service:8083"
  CATEGORIES_SERVICE_URL: "http://categories-service:8084"
  BUDGETS_SERVICE_URL: "http://budgets-service:8085"
  INVESTMENTS_SERVICE_URL: "http://investments-service:8086"
  FORECASTS_SERVICE_URL: "http://forecasts-service:8087"
  NOTIFICATIONS_SERVICE_URL: "http://notifications-service:8088"
  AUDIT_SERVICE_URL: "http://audit-service:8089"
  BANK_INTEGRATION_SERVICE_URL: "http://bank-integration-service:8090"
  ASSISTANT_SERVICE_URL: "http://assistant-service:8091"
