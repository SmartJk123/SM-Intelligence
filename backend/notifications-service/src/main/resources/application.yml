server:
  port: ${PORT:8088}

spring:
  application:
    name: notifications-service

  datasource:
    # Locally DB_URL wins. On Render the address is built from DB_HOST, DB_PORT and DB_NAME,
    # and DB_SCHEMA keeps each service in its own schema of one shared database.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5439}/${DB_NAME:smi_notifications}?currentSchema=${DB_SCHEMA:public}}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # Created on first start when it does not exist yet.
    schemas: ${DB_SCHEMA:public}
    locations: classpath:db/migration
