services:

  # ============================================================
  # DATABASES — one PostgreSQL instance per service
  # ============================================================
  postgres-identity:
    image: postgres:15-alpine
    container_name: smi-postgres-identity
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: smi_identity
    ports:
      - "55432:5432"
    volumes:
      - pgdata-identity:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-accounts:
    image: postgres:15-alpine
    container_name: smi-postgres-accounts
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: smi_accounts
    ports:
      - "5433:5432"
    volumes:
      - pgdata-accounts:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-transactions:
    image: postgres:15-alpine
    container_name: smi-postgres-transactions
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: smi_transactions
    ports:
      - "5434:5432"
    volumes:
      - pgdata-transactions:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-categories:
    image: postgres:15-alpine
    container_name: smi-postgres-categories
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: smi_categories
    ports:
      - "5435:5432"
    volumes:
      - pgdata-categories:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-budgets:
    image: postgres:15-alpine
    container_name: smi-postgres-budgets
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: smi_budgets
    ports:
      - "5436:5432"
    volumes:
      - pgdata-budgets:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-investments:
    image: postgres:15-alpine
    container_name: smi-postgres-investments
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: smi_investments
    ports:
      - "5437:5432"
    volumes:
      - pgdata-investments:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-forecasts:
    image: postgres:15-alpine
    container_name: smi-postgres-forecasts
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: smi_forecasts
    ports:
      - "5438:5432"
    volumes:
      - pgdata-forecasts:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-notifications:
    image: postgres:15-alpine
    container_name: smi-postgres-notifications
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: smi_notifications
    ports:
      - "5439:5432"
    volumes:
      - pgdata-notifications:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-audit:
    image: postgres:15-alpine
    container_name: smi-postgres-audit
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: smi_audit
    ports:
      - "5440:5432"
    volumes:
      - pgdata-audit:/var/lib/postgresql/data
    restart: unless-stopped

  # ============================================================
  # MESSAGING — Kafka for async inter-service communication
  # ============================================================
  kafka:
    image: apache/kafka:3.9.0
    container_name: smi-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@smi-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://smi-kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    restart: unless-stopped

volumes:
  pgdata-identity:
  pgdata-accounts:
  pgdata-transactions:
  pgdata-categories:
  pgdata-budgets:
  pgdata-investments:
  pgdata-forecasts:
  pgdata-notifications:
  pgdata-audit: