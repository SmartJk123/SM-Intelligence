server:
  port: ${PORT:8082}

spring:
  application:
    name: accounts-service

  datasource:
    # Locally DB_URL wins. On Render the address is built from DB_HOST, DB_PORT and DB_NAME,
    # and DB_SCHEMA keeps each service in its own schema of one shared database.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:smi_accounts}?currentSchema=${DB_SCHEMA:accounts}}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:accounts}

  flyway:
    enabled: true
    create-schemas: true
    schemas: ${DB_SCHEMA:accounts}
    default-schema: ${DB_SCHEMA:accounts}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
