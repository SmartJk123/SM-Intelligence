server:
  port: ${PORT:8080}
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: invoices
              uri: ${TRANSACTIONS_SERVICE_URL:http://${TRANSACTIONS_SERVICE_HOSTPORT:localhost:8083}}
              predicates:
                - Path=/api/invoices,/api/invoices/**
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://${IDENTITY_SERVICE_HOSTPORT:localhost:8081}}
              predicates:
                - Path=/api/auth/**
            - id: identity-service-organizations
              uri: ${IDENTITY_SERVICE_URL:http://${IDENTITY_SERVICE_HOSTPORT:localhost:8081}}
              predicates:
                - Path=/api/organizations,/api/organizations/**
            - id: identity-admin-users
              uri: ${IDENTITY_SERVICE_URL:http://${IDENTITY_SERVICE_HOSTPORT:localhost:8081}}
              predicates:
                - Path=/api/v1/admin/users/**
            - id: accounts-service
              uri: ${ACCOUNTS_SERVICE_URL:http://${ACCOUNTS_SERVICE_HOSTPORT:localhost:8082}}
              predicates:
                - Path=/api/accounts/**
            - id: transactions-service
              uri: ${TRANSACTIONS_SERVICE_URL:http://${TRANSACTIONS_SERVICE_HOSTPORT:localhost:8083}}
              predicates:
                - Path=/api/transactions/**
            - id: bank-integration-webhooks
              uri: ${BANK_INTEGRATION_SERVICE_URL:http://${BANK_INTEGRATION_SERVICE_HOSTPORT:localhost:8090}}
              predicates:
                - Path=/api/v1/webhooks/**
            - id: bank-integration-admin
              uri: ${BANK_INTEGRATION_SERVICE_URL:http://${BANK_INTEGRATION_SERVICE_HOSTPORT:localhost:8090}}
              predicates:
                - Path=/api/v1/admin/bank-integrations/**
            - id: bank-integration-stats
              uri: ${BANK_INTEGRATION_SERVICE_URL:http://${BANK_INTEGRATION_SERVICE_HOSTPORT:localhost:8090}}
              predicates:
                - Path=/api/v1/admin/stats/**
            - id: assistant-service
              uri: ${ASSISTANT_SERVICE_URL:http://${ASSISTANT_SERVICE_HOSTPORT:localhost:8091}}
              predicates:
                - Path=/api/assistant/**
            - id: bank-integration-demo
              uri: ${BANK_INTEGRATION_SERVICE_URL:http://${BANK_INTEGRATION_SERVICE_HOSTPORT:localhost:8090}}
              predicates:
                - Path=/api/v1/admin/demo/**
            - id: bank-integration-account-links
              uri: ${BANK_INTEGRATION_SERVICE_URL:http://${BANK_INTEGRATION_SERVICE_HOSTPORT:localhost:8090}}
              predicates:
                # Customers link and remove their own accounts here (the bank service checks ownership).
                - Path=/api/v1/admin/account-links,/api/v1/admin/account-links/**
            - id: budgets-service
              uri: ${BUDGETS_SERVICE_URL:http://${BUDGETS_SERVICE_HOSTPORT:localhost:8085}}
              predicates:
                - Path=/api/budgets,/api/budgets/**
            - id: investments-service
              uri: ${INVESTMENTS_SERVICE_URL:http://${INVESTMENTS_SERVICE_HOSTPORT:localhost:8086}}
              predicates:
                - Path=/api/investments,/api/investments/**
            - id: categories-service
              uri: ${CATEGORIES_SERVICE_URL:http://${CATEGORIES_SERVICE_HOSTPORT:localhost:8084}}
              predicates:
                - Path=/api/categories,/api/categories/**
            - id: forecasts-service
              uri: ${FORECASTS_SERVICE_URL:http://${FORECASTS_SERVICE_HOSTPORT:localhost:8087}}
              predicates:
                - Path=/api/forecasts,/api/forecasts/**
            - id: notifications-service
              uri: ${NOTIFICATIONS_SERVICE_URL:http://${NOTIFICATIONS_SERVICE_HOSTPORT:localhost:8088}}
              predicates:
                - Path=/api/notifications,/api/notifications/**
            - id: audit-service
              uri: ${AUDIT_SERVICE_URL:http://${AUDIT_SERVICE_HOSTPORT:localhost:8089}}
              predicates:
                - Path=/api/audit,/api/audit/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
