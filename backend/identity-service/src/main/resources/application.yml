server:
  port: ${PORT:8081}

spring:
  application:
    name: identity-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smi_identity}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:smart-money-intelligence-super-secret-key-for-jwt-signing-minimum-256-bits-long-key-12345}
  expiration-ms: 86400000

app:
  admin:
    emails: ${ADMIN_EMAILS:}
  # Outgoing email for password reset links. Leave SMTP_HOST unset to disable sending.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${MAIL_FROM:}
  frontend:
    # Sign-in page named in organisation invitation emails.
    login-url: ${FRONTEND_LOGIN_URL:http://localhost:4200/login}
  password-reset:
    # The web app page the emailed link opens; the token is appended as ?token=
    url: ${PASSWORD_RESET_URL:http://localhost:4200/reset-password}
    valid-minutes: 60
