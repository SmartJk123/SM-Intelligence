server:
  port: ${PORT:8081}

spring:
  application:
    name: identity-service

  datasource:
    # Locally DB_URL wins. On Render the address is built from DB_HOST, DB_PORT and DB_NAME,
    # and DB_SCHEMA keeps each service in its own schema of one shared database.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smi_identity}?currentSchema=${DB_SCHEMA:public}}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # Created on first start when it does not exist yet.
    schemas: ${DB_SCHEMA:public}
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:smart-money-intelligence-super-secret-key-for-jwt-signing-minimum-256-bits-long-key-12345}
  expiration-ms: 86400000

app:
  admin:
    emails: ${ADMIN_EMAILS:}
  # Outgoing email for password reset links. Leave SMTP_HOST unset to disable sending.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${MAIL_FROM:}
  frontend:
    # Sign-in page named in organisation invitation emails.
    login-url: ${FRONTEND_LOGIN_URL:http://localhost:4200/login}
  password-reset:
    # The web app page the emailed link opens; the token is appended as ?token=
    url: ${PASSWORD_RESET_URL:http://localhost:4200/reset-password}
    valid-minutes: 60
  # Emails the administrators when a service is down or degraded (see ServiceHealthMonitor).
  # Uses the SMTP settings above; without them alerts are only logged.
  health-monitor:
    enabled: ${HEALTH_MONITOR_ENABLED:true}
    interval: ${HEALTH_MONITOR_INTERVAL:PT1M}
    initial-delay: ${HEALTH_MONITOR_INITIAL_DELAY:PT2M}
    failures-before-alert: ${HEALTH_MONITOR_FAILURES_BEFORE_ALERT:2}
    reminder-interval: ${HEALTH_ALERT_REMINDER:PT1H}
    recipients: ${HEALTH_ALERT_EMAILS:${ADMIN_EMAILS:}}
    # name=address pairs. On Render the *_SERVICE_HOSTPORT values are the private addresses.
    targets: ${HEALTH_MONITOR_TARGETS:api-gateway=http://${API_GATEWAY_HOSTPORT:localhost:8080},accounts=http://${ACCOUNTS_SERVICE_HOSTPORT:localhost:8082},transactions=http://${TRANSACTIONS_SERVICE_HOSTPORT:localhost:8083},budgets=http://${BUDGETS_SERVICE_HOSTPORT:localhost:8085},investments=http://${INVESTMENTS_SERVICE_HOSTPORT:localhost:8086},bank-integration=http://${BANK_INTEGRATION_SERVICE_HOSTPORT:localhost:8090}}
