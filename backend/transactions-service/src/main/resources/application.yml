server:
  port: ${PORT:8083}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: transactions-service

  datasource:
    # Locally DB_URL wins. On Render the address is built from DB_HOST, DB_PORT and DB_NAME,
    # and DB_SCHEMA keeps each service in its own schema of one shared database.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:smi_transactions}?currentSchema=${DB_SCHEMA:transactions}}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:transactions}

  flyway:
    enabled: true
    create-schemas: true
    schemas: ${DB_SCHEMA:transactions}
    default-schema: ${DB_SCHEMA:transactions}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
