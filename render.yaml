# SmartMoney Intelligence on Render.
#
# One public entry point, the api-gateway. The web app, the admin portal, the
# mobile app and Bruno all use its URL, so everyone signs in to the same
# accounts and sees the same transactions. Every other service is private:
# only the gateway and the other services can reach it.
#
# All data lives in the team's Supabase PostgreSQL. Each service keeps its own
# schema (DB_SCHEMA), so their tables and migration histories never collide
# with each other or with the Supabase tables the mobile app uses.
# bank-integration-service keeps the public schema it already uses there.
#
# Secrets are never in this file:
#   - JWT_SECRET and INTERNAL_SERVICE_TOKEN are generated once in the smi-shared
#     group, so every service that needs them gets the same value.
#   - Values marked "sync: false" are entered in the Render dashboard.

envVarGroups:
  # The Supabase database every service uses. Use the SESSION pooler (port
  # 5432): the transaction pooler (6543) breaks the prepared statements that
  # Hibernate and Flyway rely on.
  - name: smi-database
    envVars:
      - key: DB_HOST
        value: aws-0-eu-west-2.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      # The Supabase pooler user, postgres.<project ref>.
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

  - name: smi-shared
    envVars:
      # Signs sign-in tokens (identity-service) and checks admin tokens
      # (bank-integration-service). Must be the same in both.
      - key: JWT_SECRET
        generateValue: true
      # Lets bank-integration-service create linked accounts and move balances
      # in accounts-service. Must be the same in both.
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true

services:
  # ---------------------------------------------------------------- public
  - type: web
    name: api-gateway
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerBuildArgs:
      - key: SERVICE
        value: api-gateway
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      # Browser origins of the deployed web app and admin portal, comma separated.
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: IDENTITY_SERVICE_HOSTPORT
        fromService: { type: pserv, name: identity-service, property: hostport }
      - key: ACCOUNTS_SERVICE_HOSTPORT
        fromService: { type: pserv, name: accounts-service, property: hostport }
      - key: TRANSACTIONS_SERVICE_HOSTPORT
        fromService: { type: pserv, name: transactions-service, property: hostport }
      - key: BANK_INTEGRATION_SERVICE_HOSTPORT
        fromService: { type: web, name: bank-integration-service, property: hostport }
      - key: ASSISTANT_SERVICE_HOSTPORT
        fromService: { type: pserv, name: assistant-service, property: hostport }

  # ---------------------------------------------------------------- core
  - type: pserv
    name: identity-service
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerBuildArgs:
      - key: SERVICE
        value: identity-service
    plan: starter
    envVars:
      - key: PORT
        value: "8081"
      - key: DB_SCHEMA
        value: identity
      - fromGroup: smi-database
      - fromGroup: smi-shared
      # Comma-separated addresses that get admin portal access.
      - key: ADMIN_EMAILS
        sync: false
      # Password reset and invitation emails. Leave SMTP_HOST empty to send none.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # The deployed web app's pages named in emails.
      - key: PASSWORD_RESET_URL
        sync: false
      - key: FRONTEND_LOGIN_URL
        sync: false

  - type: pserv
    name: accounts-service
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerBuildArgs:
      - key: SERVICE
        value: accounts-service
    plan: starter
    envVars:
      - key: PORT
        value: "8082"
      - key: DB_SCHEMA
        value: accounts
      - fromGroup: smi-database
      - fromGroup: smi-shared
      - key: IDENTITY_SERVICE_HOSTPORT
        fromService: { type: pserv, name: identity-service, property: hostport }

  - type: pserv
    name: transactions-service
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerBuildArgs:
      - key: SERVICE
        value: transactions-service
    plan: starter
    envVars:
      - key: PORT
        value: "8083"
      - key: DB_SCHEMA
        value: transactions
      - fromGroup: smi-database
      - key: IDENTITY_SERVICE_HOSTPORT
        fromService: { type: pserv, name: identity-service, property: hostport }
      - key: ACCOUNTS_SERVICE_HOSTPORT
        fromService: { type: pserv, name: accounts-service, property: hostport }

  # ---------------------------------------------------------------- banks
  # Already running on Render as a web service of this name; the blueprint
  # adopts it. Public, because it is reached at bank-integration-service.onrender.com.
  - type: web
    name: bank-integration-service
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerBuildArgs:
      - key: SERVICE
        value: bank-integration-service
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8090"
      # Store everything in PostgreSQL; the local H2 file would be wiped on each deploy.
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # The schema its existing data is in.
      - key: DB_SCHEMA
        value: public
      - fromGroup: smi-database
      - fromGroup: smi-shared
      - key: PERMIT_ALL
        value: "false"
      - key: PUBLIC_BASE_URL
        value: https://sm-intelligence.globalsmartspaces.com
      - key: ACCOUNTS_SERVICE_HOSTPORT
        fromService: { type: pserv, name: accounts-service, property: hostport }
      - key: TRANSACTIONS_SERVICE_HOSTPORT
        fromService: { type: pserv, name: transactions-service, property: hostport }
      # Live notifications arrive on cPanel and are imported from there.
      - key: NCBA_CPANEL_EXPORT_URL
        value: https://sm-intelligence.globalsmartspaces.com/api/v1/webhooks/ncba/export
      - key: NCBA_CPANEL_EXPORT_TOKEN
        sync: false
      - key: KCB_CPANEL_EXPORT_URL
        value: https://sm-intelligence.globalsmartspaces.com/api/v1/webhooks/kcb/export
      - key: KCB_CPANEL_EXPORT_TOKEN
        sync: false
      - key: EQUITY_CPANEL_EXPORT_URL
        value: https://sm-intelligence.globalsmartspaces.com/api/v1/webhooks/equity/export
      - key: EQUITY_CPANEL_EXPORT_TOKEN
        sync: false
      # Bank credentials, entered in the dashboard. See backend/bank-integration-service/.env.example.
      - key: NCBA_ENV
        value: PRODUCTION
      - key: NCBA_SECRET_KEY
        sync: false
      - key: NCBA_USERNAME
        sync: false
      - key: NCBA_PASSWORD
        sync: false
      - key: NCBA_ACCOUNT_NUMBER
        sync: false
      - key: KCB_ENV
        sync: false
      - key: KCB_CLIENT_KEY
        sync: false
      - key: KCB_CLIENT_SECRET
        sync: false
      - key: KCB_PUBLIC_KEY
        sync: false
      - key: EQUITY_ENV
        sync: false
      - key: EQUITY_MERCHANT_CODE
        sync: false
      - key: EQUITY_API_KEY
        sync: false
      - key: EQUITY_CONSUMER_SECRET
        sync: false
      - key: EQUITY_ACCOUNT_NUMBER
        sync: false
      - key: EQUITY_IPN_USERNAME
        sync: false
      - key: EQUITY_IPN_PASSWORD
        sync: false
      - key: STANBIC_ENV
        sync: false
      - key: STANBIC_CLIENT_KEY
        sync: false
      - key: STANBIC_CLIENT_SECRET
        sync: false
      - key: STANBIC_API_KEY
        sync: false
      - key: STANBIC_ACCOUNT_NUMBER
        sync: false

  # ---------------------------------------------------------------- assistant
  - type: pserv
    name: assistant-service
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerBuildArgs:
      - key: SERVICE
        value: assistant-service
    plan: starter
    envVars:
      - key: PORT
        value: "8091"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: IDENTITY_SERVICE_HOSTPORT
        fromService: { type: pserv, name: identity-service, property: hostport }
      - key: ACCOUNTS_SERVICE_HOSTPORT
        fromService: { type: pserv, name: accounts-service, property: hostport }
      - key: TRANSACTIONS_SERVICE_HOSTPORT
        fromService: { type: pserv, name: transactions-service, property: hostport }
      - key: BUDGETS_SERVICE_HOSTPORT
        fromService: { type: pserv, name: budgets-service, property: hostport }

  # ---------------------------------------------------------------- supporting
  # Called by the web app's server (BUDGETS_API_URL, INVESTMENTS_API_URL) and the
  # assistant. Private: they trust the user id they are given, so they are never
  # exposed publicly. Each has its own schema in the shared database.
  - type: pserv
    name: budgets-service
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerBuildArgs:
      - key: SERVICE
        value: budgets-service
    plan: starter
    envVars:
      - key: PORT
        value: "8085"
      - key: DB_SCHEMA
        value: budgets
      - fromGroup: smi-database

  - type: pserv
    name: investments-service
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerBuildArgs:
      - key: SERVICE
        value: investments-service
    plan: starter
    envVars:
      - key: PORT
        value: "8086"
      - key: DB_SCHEMA
        value: investments
      - fromGroup: smi-database
