databases:
  - name: smi-postgres
    databaseName: smi_identity
    user: admin
    plan: starter

services:
  - type: web
    name: api-gateway
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerBuildArgs:
      - key: SERVICE
        value: api-gateway
    plan: starter
    envVars:
      - key: PORT
        value: "8080"

  - type: web
    name: identity-service
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerBuildArgs:
      - key: SERVICE
        value: identity-service
    plan: starter
    envVars:
      - key: PORT
        value: "8081"
      - key: DB_URL
        fromDatabase:
          name: smi-postgres
          property: connectionString

  - type: web
    name: accounts-service
