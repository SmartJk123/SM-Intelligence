databases:
  - name: smi-postgres
    databaseName: smi_identity
    user: admin
    plan: starter

services:
  # The service that receives notifications from Stanbic, KCB and NCBA.
  #
  # Keep it on a paid instance type: a free instance sleeps after fifteen minutes
  # and a bank posting during that sleep is lost. Its public address is
  # PUBLIC_BASE_URL below, which is what the service reports to the admin
  # interface and what the NCBA request letter carries, so it must stay stable.
  # Add the custom domain in the Render dashboard and a CNAME at the DNS provider.
  #
  # The postgres profile is required: on a container host the filesystem is
  # ephemeral, so the default H2 file database would lose every notification on
  # each deploy.
  - type: web
    name: bank-integration-service
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerBuildArgs:
      - key: SERVICE
        value: bank-integration-service
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8090"
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: PUBLIC_BASE_URL
        value: https://sm-intelligence.globalsmartspaces.com
      - key: DB_HOST
        fromDatabase:
          name: smi-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smi-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: smi-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: smi-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: smi-postgres
          property: password
      # Bank credentials. sync: false means Render reads them from the dashboard
      # and never stores them in this file.
      - key: NCBA_SECRET_KEY
        sync: false
      - key: NCBA_USERNAME
        sync: false
      - key: NCBA_PASSWORD
        sync: false
      - key: NCBA_ACCOUNT_NUMBER
        sync: false
      - key: STANBIC_CLIENT_KEY
        sync: false
      - key: STANBIC_CLIENT_SECRET
        sync: false
      - key: STANBIC_API_KEY
        sync: false
      - key: STANBIC_ACCOUNT_NUMBER
        sync: false
      - key: STANBIC_TOKEN_URL
        sync: false
      - key: KCB_CLIENT_KEY
        sync: false
      - key: KCB_CLIENT_SECRET
        sync: false
      - key: KCB_PUBLIC_KEY
        sync: false

  - type: web
    name: api-gateway
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerBuildArgs:
      - key: SERVICE
        value: api-gateway
    plan: starter
    envVars:
      - key: PORT
        value: "8080"

  - type: web
    name: identity-service
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerBuildArgs:
      - key: SERVICE
        value: identity-service
    plan: starter
    envVars:
      - key: PORT
        value: "8081"
      - key: DB_URL
        fromDatabase:
          name: smi-postgres
          property: connectionString

